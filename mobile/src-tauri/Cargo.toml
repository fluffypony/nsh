[package]
name = "nsh-mobile"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
iroh = "0.97"
nsh-proto = { path = "../../proto" }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] }
tauri-plugin-biometric = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }
